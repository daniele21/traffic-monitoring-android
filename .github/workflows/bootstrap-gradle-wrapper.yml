name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - agent/m1a-validation-app

permissions:
  contents: write

jobs:
  bootstrap-wrapper:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/m1a-validation-app
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate standard Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab

      - name: Commit generated wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already up to date."
            exit 0
          fi
          git commit -m "Generate standard Gradle 8.9 wrapper"
          git push origin HEAD:agent/m1a-validation-app
